[project]
name = "dxlean"
version = "0.1.0"
description = "Generic Lean 4 theorem-proving environment for deepxube: LLM-sampled tactics as actions, pre-trained value guidance, batch weighted A* search"
requires-python = ">=3.11"
dependencies = [
    "deepxube @ git+https://github.com/forestagostinelli/deepxube@c2e02739e7e23d97eb96a7e5b12ef19aea88ac48",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dxlean = "dxlean.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dxlean"]
